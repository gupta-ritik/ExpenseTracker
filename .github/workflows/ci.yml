name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      # Build-only placeholder so forks and repos without secrets can prerender.
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-placeholder-secret-not-for-production-use' }}
      BETTER_AUTH_URL: http://localhost:3100
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GROQ_MODEL_LARGE: ${{ secrets.GROQ_MODEL_LARGE }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Configure isolated integration database
        if: env.DATABASE_URL != '' && env.DATABASE_URL_UNPOOLED != ''
        run: |
          printf 'DATABASE_URL=%s\nDATABASE_URL_UNPOOLED=%s\nBETTER_AUTH_SECRET=%s\nBETTER_AUTH_URL=%s\n' "$DATABASE_URL" "$DATABASE_URL_UNPOOLED" "$BETTER_AUTH_SECRET" "$BETTER_AUTH_URL" > .env.test
          npm run db:test:migrate
      - run: npm test
      - run: npm run build
